services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: weihnachtsfeierdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d weihnachtsfeierdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  apiservice:
    build:
      context: ..
      dockerfile: WeihnachtsfeierBIT/WeihnachtsfeierBit.ApiService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__weihnachtsfeierdb: Host=postgres;Port=5432;Database=weihnachtsfeierdb;Username=postgres;Password=${POSTGRES_PASSWORD:-devpassword}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  adminclient:
    build:
      context: ..
      dockerfile: WeihnachtsfeierBIT/WeihnachtsfeierBit.AdminClient/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ApiBaseUrl: http://apiservice:8080
    depends_on:
      - apiservice
    restart: unless-stopped

  webfrontend:
    build:
      context: ..
      dockerfile: WeihnachtsfeierBIT/WeihnachtsfeierBit.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ApiBaseUrl: http://apiservice:8080
      AdminClientBaseUrl: http://adminclient:8080
    ports:
      - "8080:8080"
    depends_on:
      - apiservice
      - adminclient
    restart: unless-stopped

volumes:
  postgres-data: