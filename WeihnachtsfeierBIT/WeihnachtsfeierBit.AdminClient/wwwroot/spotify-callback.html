<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Spotify verbinden</title>
</head>
<body>
  <p>Spotify wird verbunden …</p>
  <script>
    const params = new URLSearchParams(location.search);
    if (window.opener) {
      window.opener.postMessage({
        type: "hitster-spotify-oauth",
        code: params.get("code"),
        state: params.get("state"),
        error: params.get("error")
      }, location.origin);
      window.close();
    } else {
      document.body.textContent = "Spotify hat dieses Fenster zurückgegeben. Du kannst es schließen.";
    }
  </script>
</body>
</html>
