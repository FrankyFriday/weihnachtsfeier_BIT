services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.server
    environment:
      PORT: "3000"
      PUBLIC_URL: "https://${DOMAIN:?Set DOMAIN in .env}"
      TRUST_PROXY: "1"
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./data/songs.json:/app/data/songs.json:ro
    networks:
      - hitster
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.status === 204 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  hitster:
